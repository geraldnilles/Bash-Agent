[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bash-agent"
version = "0.1.0"
description = "An LLM-driven autonomous agent running safely in a systemd sandbox"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.8"
dependencies = [
    "openai",
    "numpy",
    "Pillow",
    "requests",
]

[project.scripts]
bagent = "bash_agent.main:main"
search = "bash_agent.search:main"
transcribe = "bash_agent.transcribe:main"
vision = "bash_agent.vision:main"
memo = "bash_agent.memo:main"
